name: Build Android APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-wrapper/package-lock.json
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: android-wrapper
        run: npm ci
      - name: Build APK
        working-directory: android-wrapper
        shell: bash
        run: |
          npm run android:sync
          cd android
          gradle assembleDebug
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          files: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          name: Ritim ${{ github.ref_name }}
          generate_release_notes: true
